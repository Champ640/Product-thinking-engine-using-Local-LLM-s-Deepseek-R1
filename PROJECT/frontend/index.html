<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PRODUCT THINKER — AI-powered product ideation and market intelligence system. Turn rough ideas into validated MVP plans.">
  <title>PRODUCT THINKER — AI Product Strategist</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <!-- Top Navigation -->
  <nav class="top-nav" id="top-nav">
    <a href="/" class="top-nav__brand">
      <span class="top-nav__brand-icon">🧠</span>
      <span class="top-nav__brand-name">Product Thinker</span>
    </a>
    <div class="top-nav__right">
      <span class="badge-pill" id="occupation-badge" style="display:none;"></span>
      <span class="status-dot status-dot--loading" id="status-dot" title="Checking Ollama..."></span>
    </div>
  </nav>

  <div class="app-container">

    <!-- Welcome / Occupation Selector Screen -->
    <section class="welcome-screen" id="welcome-screen">
      <h1 class="welcome-screen__title">What do you do?</h1>
      <p class="welcome-screen__subtitle">
        Tell us your occupation and we'll tailor product ideas, market analysis, and MVP plans to your unique strengths.
      </p>
      <div class="occupation-grid" id="occupation-grid">
        <!-- Populated by JS -->
      </div>
      <div class="custom-occupation" id="custom-occupation-area" style="display:none;">
        <input class="chat-input" type="text" id="custom-occupation-input" placeholder="Type your occupation...">
        <button class="btn-primary" id="custom-occupation-btn">Continue</button>
      </div>
    </section>

    <!-- Chat Screen (hidden initially) -->
    <section class="hidden" id="chat-screen">
      <!-- Stage Progress -->
      <div class="stage-progress" id="stage-progress">
        <div class="stage-item stage-brainstorm" id="stage-brainstorm" data-stage="brainstorm">🧠 Brainstorm</div>
        <div class="stage-connector"></div>
        <div class="stage-item stage-sentiment" id="stage-sentiment" data-stage="sentiment">📊 Sentiment</div>
        <div class="stage-connector"></div>
        <div class="stage-item stage-niche" id="stage-niche" data-stage="niche">🔍 Niche</div>
        <div class="stage-connector"></div>
        <div class="stage-item stage-mvp" id="stage-mvp" data-stage="mvp">📋 MVP Plan</div>
      </div>

      <!-- Error Banner -->
      <div class="error-banner" id="error-banner"></div>

      <!-- Chat Messages -->
      <div class="chat-area" id="chat-area">
        <!-- Messages injected by JS -->
      </div>

      <!-- Chat Input -->
      <div class="chat-input-area" id="chat-input-area">
        <input class="chat-input" type="text" id="chat-input" placeholder="Describe your product idea..." autofocus>
        <button class="btn-primary" id="send-btn">Send ↗</button>
      </div>

      <!-- Action Bar (shown after plan) -->
      <div class="action-bar hidden" id="action-bar">
        <button class="btn-primary" id="download-btn">📄 Download Plan</button>
        <button class="btn-outline" id="restart-btn">🔄 Start Over</button>
      </div>

      <!-- Plan Viewer -->
      <div class="plan-viewer" id="plan-viewer"></div>
    </section>

    <!-- Footer -->
    <footer class="app-footer">
      <div class="footer-content">
        <p>&copy; 2025 Product Thinker. Powered by Local AI (DeepSeek R1).</p>
      </div>
    </footer>
  </div>

  <!-- Scripts -->
  <script src="/js/occupation.js"></script>
  <script src="/js/chat.js"></script>
  <script src="/js/plan-viewer.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
